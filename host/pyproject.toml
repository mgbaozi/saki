[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saki-host"
dynamic = ["version"]
description = "Mac companion for the Saki AI Agent status display"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
saki-host = "saki_host.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "saki_host.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"
